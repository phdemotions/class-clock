name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  # Opt out of IBM telemetry collected by Carbon packages during install.
  IBM_TELEMETRY_DISABLED: "true"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
